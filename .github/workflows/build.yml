name: build

on:
  push:
    branches:
      - 'test/**'

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run end-to-end installer validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ./runner.sh
