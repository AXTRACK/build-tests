name: build

on:
  push:
    branches:
      - 'test/**'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Run scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ./runner.sh
