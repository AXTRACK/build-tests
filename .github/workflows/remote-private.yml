name: remote deterministic tests

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Private source repository in owner/name form
        required: true
        type: string
      source_sha:
        description: Exact source commit SHA
        required: true
        type: string
      base_sha:
        description: Exact comparison base SHA
        required: true
        type: string
      matrix:
        description: JSON matrix with scope and runner entries
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: remote-tests-${{ inputs.source_repository }}-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    name: ${{ matrix.scope }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact private source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.CODEX_TEST_SOURCE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'

      - name: Run selected scope
        shell: pwsh
        env:
          CODEX_ROOT: ${{ github.workspace }}
        run: pwsh -NoProfile -File "${{ matrix.runner }}"
