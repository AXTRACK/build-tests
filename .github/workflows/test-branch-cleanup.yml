name: test branch cleanup

on:
  workflow_run:
    workflows:
      - build
    types:
      - completed
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-branch-cleanup
  cancel-in-progress: false

jobs:
  terminal:
    if: >-
      github.event_name == 'workflow_run' &&
      startsWith(github.event.workflow_run.head_branch, 'test/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete completed test branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          ref="heads/$TEST_BRANCH"
          encoded_ref=$(REF="$ref" python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["REF"], safe=""))')
          status=$(curl --silent --show-error --output response.txt --write-out '%{http_code}' \
            --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs/$encoded_ref")
          if [[ "$status" == "204" || "$status" == "422" ]]; then
            exit 0
          fi
          cat response.txt
          echo "Unexpected GitHub API status: $status" >&2
          exit 1

  stale:
    if: github.event_name == 'workflow_run' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete stale test branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '2 days ago' +%s)
          page=1
          while true; do
            payload=$(curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches?per_page=100&page=$page")
            count=$(python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' <<<"$payload")
            [[ "$count" -eq 0 ]] && break
            python3 -c 'import json,sys; [print(x["name"]) for x in json.load(sys.stdin) if x["name"].startswith("test/")]' <<<"$payload" |
            while IFS= read -r branch; do
              [[ -z "$branch" ]] && continue
              encoded_branch=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")
              commit=$(curl --fail-with-body --silent --show-error \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$encoded_branch")
              committed=$(python3 -c 'import json,sys,datetime; d=json.load(sys.stdin)["commit"]["committer"]["date"]; print(int(datetime.datetime.fromisoformat(d.replace("Z","+00:00")).timestamp()))' <<<"$commit")
              if [[ "$committed" -lt "$cutoff" ]]; then
                ref="heads/$branch"
                encoded_ref=$(REF="$ref" python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["REF"], safe=""))')
                status=$(curl --silent --show-error --output response.txt --write-out '%{http_code}' \
                  --request DELETE \
                  --header "Accept: application/vnd.github+json" \
                  --header "Authorization: Bearer $GH_TOKEN" \
                  --header "X-GitHub-Api-Version: 2022-11-28" \
                  "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs/$encoded_ref")
                if [[ "$status" != "204" && "$status" != "422" ]]; then
                  cat response.txt
                  echo "Failed to delete $branch: HTTP $status" >&2
                  exit 1
                fi
              fi
            done
            page=$((page + 1))
          done
