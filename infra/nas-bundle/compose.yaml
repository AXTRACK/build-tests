name: agent-notify

services:
  telegram-mcp:
    image: ghcr.io/axtrack/fast-mcp-telegram:c3779a2f-amd64
    container_name: agent-notify-telegram-mcp
    restart: unless-stopped
    env_file: [./.env]
    environment:
      SERVER_MODE: http-auth
      HOST: 0.0.0.0
      PORT: 8000
      SESSION_DIR: /data/sessions
      ACL_ENABLED: "true"
      ACL_CONFIG_PATH: /config/acl.yaml
      ACL_DENY_UNLISTED_PRINCIPALS: "true"
      DO_NOT_TRACK: "1"
      LOG_LEVEL: INFO
    volumes:
      - ./data/telegram-sessions:/data/sessions
      - ./config:/config:ro
    expose: ["8000"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  telegram-mcp-setup:
    profiles: ["setup"]
    image: ghcr.io/axtrack/fast-mcp-telegram:c3779a2f-amd64
    env_file: [./.env]
    environment:
      SESSION_DIR: /data/sessions
      DO_NOT_TRACK: "1"
    volumes:
      - ./data/telegram-sessions:/data/sessions
    stdin_open: true
    tty: true
    networks: [backend]
    command: python -m src.cli_setup --overwrite

  telegram-bot-api:
    image: ghcr.io/axtrack/telegram-bot-api:e3e9dd8e-amd64
    container_name: agent-notify-telegram-bot-api
    restart: unless-stopped
    env_file: [./.env]
    command:
      - --local
      - --http-port=8081
      - --http-stat-port=8082
      - --dir=/var/lib/telegram-bot-api
      - --files-dir=/var/lib/telegram-bot-api
      - --temp-dir=/tmp/telegram-bot-api
      - --verbosity=1
    volumes:
      - ./data/telegram-bot-api:/var/lib/telegram-bot-api
    expose: ["8081","8082"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8082' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  openai-tunnel:
    profiles: ["tunnel"]
    image: ghcr.io/axtrack/openai-tunnel-client:0.0.15-amd64
    container_name: agent-notify-openai-tunnel
    restart: unless-stopped
    env_file: [./.env]
    volumes:
      - ./config/tunnel-client.yaml:/config/tunnel-client.yaml:ro
      - ./data/tunnel-client:/data
    networks: [backend]
    depends_on:
      telegram-mcp:
        condition: service_healthy
    command: ["run","--profile-file","/config/tunnel-client.yaml"]

networks:
  backend:
    name: agent-notify-backend
